<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The River's Verse: Tactical Narrative Interface</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Narrative Palette */
            --bg-color-1: #E0EAFC;
            --bg-color-2: #CFDEF3;
            --bg-color-3: #f5b0cb;
            --bg-color-4: #F6D365;

            /* Tactical Palette */
            --hud-bg: rgba(20, 25, 30, 0.85);
            --hud-text: #E0E0E0;
            --hud-accent: #0A9396;
            --hud-warning: #EE9B00;
            --hud-critical: #AE2012;
            --hud-border: rgba(255, 255, 255, 0.1);

            --text-color: #3D405B;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --accent-color: #81B29A;
            
            --marker-color: #0A9396;
            --marker-pulse-color: #0A9396;
            --marker-active-color: #EE9B00;
            --marker-border-color: white;

            --font-heading: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* --- Base & Body --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            color: var(--text-color);
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), var(--bg-color-4));
            background-size: 400% 400%;
            animation: gradientBG 30s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Main App Container --- */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-rows: 1fr;
        }

        /* --- Map Container --- */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-container {
            background-color: transparent !important;
        }

        /* --- Tactical HUD --- */
        #hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none; /* Allow clicks through to map where transparent */
        }

        .hud-panel {
            background: var(--hud-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--hud-border);
            border-left: 3px solid var(--hud-accent);
            padding: 15px;
            color: var(--hud-text);
            font-family: var(--font-mono);
            min-width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            transform: translateX(-120%);
            animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.5s;
        }

        @keyframes slideInLeft {
            to { transform: translateX(0); }
        }

        .hud-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .hud-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--hud-accent);
            box-shadow: 0 0 5px var(--hud-accent);
            margin-right: 8px;
        }
        
        .status-critical { background-color: var(--hud-critical); box-shadow: 0 0 5px var(--hud-critical); }
        .status-warning { background-color: var(--hud-warning); box-shadow: 0 0 5px var(--hud-warning); }

        /* --- Timeline Control --- */
        #timeline-control {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 80%;
            max-width: 800px;
            z-index: 1000;
            background: var(--hud-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 1s;
        }

        @keyframes slideUp {
            to { transform: translateX(-50%) translateY(0); }
        }

        #play-pause-btn {
            background: transparent;
            border: 2px solid var(--hud-accent);
            color: var(--hud-accent);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #play-pause-btn:hover {
            background: var(--hud-accent);
            color: #fff;
        }

        #timeline-slider-container {
            flex-grow: 1;
            position: relative;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
        }

        #timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--hud-accent);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        /* --- Map Markers & Path --- */
        .journey-marker {
            width: 16px;
            height: 16px;
            background-color: var(--marker-color);
            border: 2px solid var(--marker-border-color);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        
        .journey-marker:hover { transform: scale(1.3); }
        .journey-marker.active {
            background-color: var(--marker-active-color);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--marker-active-color);
        }

        /* --- Story Panel --- */
        #story-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 1002;
            transition: right 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 80px 40px 40px 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        #story-panel.active { right: 0; }
        
        #story-panel h3 {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin: 0 0 15px 0;
            color: var(--text-color);
        }

        #close-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        #close-panel:hover { opacity: 1; }
        #close-panel::before, #close-panel::after {
            content: '';
            position: absolute;
            left: 14px;
            top: 5px;
            height: 20px;
            width: 2px;
            background: var(--text-color);
        }
        #close-panel::before { transform: rotate(45deg); }
        #close-panel::after { transform: rotate(-45deg); }

        /* --- SVG --- */
        #river-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10vh;
            z-index: 2;
            pointer-events: none;
        }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }

        /* --- Command Terminal --- */
        #terminal-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            background: var(--hud-bg);
            border: 1px solid var(--hud-accent);
            color: var(--hud-accent);
            width: 40px;
            height: 40px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        #terminal-toggle:hover {
            background: var(--hud-accent);
            color: #000;
            box-shadow: 0 0 15px var(--hud-accent);
        }

        #terminal-container {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 500px;
            max-width: 90vw;
            height: 300px;
            background-color: #0c0c0c;
            border: 1px solid var(--hud-accent);
            border-radius: 5px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            font-family: var(--font-mono);
            color: var(--hud-accent);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            transform: scale(0);
            transform-origin: bottom right;
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            overflow: hidden;
        }

        #terminal-container.active {
            transform: scale(1);
        }

        #terminal-header {
            background: rgba(10, 147, 150, 0.2);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--hud-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        #terminal-output {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            scrollbar-width: thin;
            scrollbar-color: var(--hud-accent) transparent;
        }

        #terminal-output::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-thumb { background-color: var(--hud-accent); }

        .log-entry { margin-bottom: 5px; }
        .log-info { color: var(--hud-text); }
        .log-success { color: #4ade80; }
        .log-warn { color: var(--hud-warning); }
        .log-error { color: var(--hud-critical); }
        .log-system { opacity: 0.7; font-style: italic; }

        #terminal-input-line {
            display: flex;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(10, 147, 150, 0.3);
        }

        #terminal-prompt {
            margin-right: 8px;
            font-weight: bold;
        }

        #terminal-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--hud-accent);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            outline: none;
        }

        /* CRT Effect */
        #terminal-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #timeline-control {
                width: 90%;
                bottom: 20px;
            }
            .hud-panel {
                min-width: auto;
                width: auto;
                font-size: 0.8rem;
            }
            #story-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        
        <!-- HUD Overlay -->
        <div id="hud-overlay">
            <div class="hud-panel">
                <div class="hud-title">Mission Phase</div>
                <div class="hud-value" id="hud-phase">Awaiting Input</div>
            </div>
            <div class="hud-panel">
                <div class="hud-title">Operational Status</div>
                <div class="hud-row">
                    <span id="hud-status-text">Standby</span>
                    <div id="hud-status-light" class="status-indicator"></div>
                </div>
            </div>
            <div class="hud-panel">
                <div class="hud-title">Distance</div>
                <div class="hud-value"><span id="hud-distance">0</span> mi</div>
            </div>
        </div>

        <!-- Map -->
        <div id="map"></div>

        <!-- Timeline Control -->
        <div id="timeline-control">
            <button id="play-pause-btn" aria-label="Play Mission">
                <svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L13 9L1 17V1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>
            <div id="timeline-slider-container">
                <div id="timeline-progress"></div>
            </div>
        </div>

        <!-- Story Panel -->
        <div id="story-panel">
            <button id="close-panel" aria-label="Close panel"></button>
            <h3 id="panel-title"></h3>
            <div id="panel-body"></div>
        </div>

        <!-- Decor -->
        <div id="river-svg">
            <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                <defs>
                    <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                </defs>
                <g class="parallax">
                    <use href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7" />
                    <use href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                    <use href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                    <use href="#gentle-wave" x="48" y="7" fill="#fff" />
                </g>
            </svg>
        </div>

        <!-- Command Terminal -->
        <div id="terminal-toggle" title="Open Command Terminal">>_</div>
        <div id="terminal-container">
            <div id="terminal-header">
                <span>HF-OS v2.4.1 [RESTRICTED]</span>
                <span id="terminal-clock">00:00:00</span>
            </div>
            <div id="terminal-output">
                <div class="log-entry log-system">Initializing tactical interface...</div>
                <div class="log-entry log-system">Connection established.</div>
                <div class="log-entry log-info">Welcome, Operative. Type 'HELP' for command list.</div>
            </div>
            <div id="terminal-input-line">
                <span id="terminal-prompt">root@river:~$</span>
                <input type="text" id="terminal-input" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <script>
        /**
         * The River's Verse - Tactical Narrative Interface
         * Modular Architecture
         */

        // --- Configuration & Data ---
        const CONFIG = {
            animationSpeed: 5000, // Time to play through full journey in ms (base speed)
            zoomLevel: 7
        };

        const JOURNEY_DATA = [
            {
                id: 'st-petersburg',
                lat: 38.6270, lng: -90.1994,
                title: "St. Petersburg",
                content: "The fictional starting point, representing Hannibal, Missouri. Here, Huck feels 'so lonesome I most wished I was dead,' trapped by the Widow Douglas and the constraints of 'sivilized' life.",
                quote: "The stars were shining, and the leaves rustled in the woods ever so mournful.",
                phase: "Extraction",
                risk: "Low",
                mile: 0
            },
            {
                id: 'jacksons-island',
                lat: 38.4842, lng: -90.4143,
                title: "Jackson's Island",
                content: "Huck's first taste of true freedom. He fakes his own death and escapes to this island. Instead of solitude, he finds Jim, Miss Watson's runaway slave.",
                quote: "I was ever so glad to see Jim. I warn't lonesome now.",
                phase: "Evasion",
                risk: "Medium",
                mile: 15
            },
            {
                id: 'cairo',
                lat: 37.0095, lng: -89.1353,
                title: "Cairo & The Fog",
                content: "A dense fog causes Huck and Jim to miss the Ohio River at Cairo, the turnoff to the free states. This fateful accident sends them deeper into the slave-holding South.",
                quote: "We could hear voices, but we couldn't see anything. We got separated.",
                phase: "Navigation",
                risk: "High",
                mile: 120
            },
            {
                id: 'grangerfords',
                lat: 35.8395, lng: -90.0610,
                title: "The Grangerfords",
                content: "Huck is taken in by the aristocratic Grangerfords, who are locked in a deadly, senseless feud with the Shepherdsons.",
                quote: "There ain't no telling how cheating anybody is, or how honest, or how mean.",
                phase: "Conflict",
                risk: "Critical",
                mile: 250
            },
            {
                id: 'duke-king',
                lat: 34.4011, lng: -90.8740,
                title: "The Duke and the King",
                content: "Two con men take over the raft. They represent the worst of society, swindling townsfolk along the river. Huck is forced to be their accomplice.",
                quote: "It was enough to make a body ashamed of the human race.",
                phase: "Infiltration",
                risk: "High",
                mile: 350
            },
            {
                id: 'wilks',
                lat: 33.1593, lng: -91.2404,
                title: "The Wilks Scandal",
                content: "The Duke and King's most audacious scam: impersonating the heirs to a local family's fortune. Huck's conscience finally wins, and he acts to expose them.",
                quote: "I says to myself, this is another one that I'm letting him rob her of her money.",
                phase: "Deception",
                risk: "High",
                mile: 480
            },
            {
                id: 'phelps',
                lat: 32.7471, lng: -91.0715,
                title: "The Phelps Farm",
                content: "The journey's climax. The King sells Jim. Huck decides to defy religion and society to save his friend, finalizing his moral transformation.",
                quote: "'All right, then, I'll go to hell'—and tore it up.",
                phase: "Climax",
                risk: "Critical",
                mile: 600
            }
        ];

        // --- Modules ---

        /**
         * Manages the data and calculates interpolations
         */
        class IntelSystem {
            constructor(data) {
                this.data = data;
                this.totalDistance = data[data.length - 1].mile;
            }

            getPoints() {
                return this.data;
            }

            // Get the active segment based on progress (0.0 to 1.0)
            getDataAtProgress(progress) {
                const targetMile = progress * this.totalDistance;

                // Find the segment we are in
                let currentPoint = this.data[0];
                let nextPoint = this.data[1];
                let index = 0;

                for (let i = 0; i < this.data.length - 1; i++) {
                    if (targetMile >= this.data[i].mile && targetMile <= this.data[i+1].mile) {
                        currentPoint = this.data[i];
                        nextPoint = this.data[i+1];
                        index = i;
                        break;
                    }
                }

                // If we are past the last point
                if (progress >= 1) {
                    currentPoint = this.data[this.data.length - 1];
                    nextPoint = currentPoint;
                    index = this.data.length - 1;
                }

                return { currentPoint, nextPoint, index, targetMile };
            }
        }

        /**
         * Manages the Map, Markers, and Vectors
         */
        class TacticalMap {
            constructor(elementId, initialLat, initialLng) {
                this.map = L.map(elementId, {
                    zoomControl: false,
                    scrollWheelZoom: false,
                    attributionControl: false
                }).setView([initialLat, initialLng], CONFIG.zoomLevel);

                // Add attribution manually in a cleaner way if needed, or stick to default
                L.control.attribution({position: 'bottomright'}).addTo(this.map);

                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19
                }).addTo(this.map);

                this.markers = [];
                this.routeLine = null;
            }

            renderMarkers(data, onMarkerClick) {
                data.forEach((point) => {
                    const icon = L.divIcon({
                        className: 'journey-marker',
                        iconSize: [16, 16]
                    });
                    
                    const marker = L.marker([point.lat, point.lng], { icon: icon })
                        .addTo(this.map);

                    // Add accessibility features
                    const el = marker.getElement();
                    if (el) {
                        el.setAttribute('tabindex', '0');
                        el.setAttribute('role', 'button');
                        el.setAttribute('aria-label', `Select ${point.title}`);

                        el.addEventListener('click', () => onMarkerClick(point));
                        el.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                onMarkerClick(point);
                            }
                        });
                    }

                    marker.pointId = point.id;
                    this.markers.push(marker);
                });
            }

            renderRoute(data) {
                const latlngs = data.map(d => [d.lat, d.lng]);
                this.routeLine = L.polyline(latlngs, {
                    color: 'var(--hud-accent)',
                    weight: 2,
                    opacity: 0.6,
                    dashArray: '5, 10',
                    lineCap: 'round'
                }).addTo(this.map);
            }

            highlightMarker(index) {
                this.markers.forEach((marker, i) => {
                    const el = marker.getElement();
                    if (el) {
                        if (i === index) {
                            el.classList.add('active');
                        } else {
                            el.classList.remove('active');
                        }
                    }
                });
            }

            panTo(lat, lng) {
                this.map.flyTo([lat, lng], CONFIG.zoomLevel, {
                    animate: true,
                    duration: 1.5
                });
            }
        }

        /**
         * Manages the Heads-Up Display and Story Panel
         */
        class HUDInterface {
            constructor() {
                this.els = {
                    phase: document.getElementById('hud-phase'),
                    statusText: document.getElementById('hud-status-text'),
                    statusLight: document.getElementById('hud-status-light'),
                    distance: document.getElementById('hud-distance'),
                    storyPanel: document.getElementById('story-panel'),
                    panelTitle: document.getElementById('panel-title'),
                    panelBody: document.getElementById('panel-body'),
                    closeBtn: document.getElementById('close-panel'),
                    playBtn: document.getElementById('play-pause-btn'),
                    progress: document.getElementById('timeline-progress'),
                    sliderContainer: document.getElementById('timeline-slider-container')
                };

                this.els.closeBtn.addEventListener('click', () => this.hideStory());
            }

            updateStatus(point) {
                this.els.phase.textContent = point.phase;
                this.els.distance.textContent = point.mile;
                this.els.statusText.textContent = point.risk;

                // Update risk light
                this.els.statusLight.className = 'status-indicator';
                if (point.risk === 'Critical') this.els.statusLight.classList.add('status-critical');
                if (point.risk === 'High') this.els.statusLight.classList.add('status-warning');
            }

            updateProgress(percent) {
                this.els.progress.style.width = `${percent * 100}%`;
            }

            setPlayState(isPlaying) {
                this.els.playBtn.innerHTML = isPlaying
                    ? '<svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor"><rect width="4" height="16" x="1" y="1" rx="1"/><rect width="4" height="16" x="9" y="1" rx="1"/></svg>'
                    : '<svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor"><path d="M1 1L13 9L1 17V1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
            }

            showStory(point) {
                this.els.panelTitle.textContent = point.title;
                this.els.panelBody.innerHTML = `
                    <p>${point.content}</p>
                    <p style="font-style: italic; border-left: 2px solid var(--accent-color); padding-left: 15px; margin-top: 20px;">
                        "${point.quote}"
                    </p>
                `;
                this.els.storyPanel.classList.add('active');
            }

            hideStory() {
                this.els.storyPanel.classList.remove('active');
            }
        }

        /**
         * Command & Control Terminal
         */
        class CommandTerminal {
            constructor(missionControl) {
                this.mc = missionControl;
                this.isOpen = false;
                this.history = [];
                this.historyIndex = -1;

                this.els = {
                    container: document.getElementById('terminal-container'),
                    output: document.getElementById('terminal-output'),
                    input: document.getElementById('terminal-input'),
                    toggle: document.getElementById('terminal-toggle'),
                    clock: document.getElementById('terminal-clock')
                };

                this.secretIntel = {
                    'st-petersburg': "Subject 001 (Finn) shows signs of rebellion against social programming. Monitor closely.",
                    'jacksons-island': "Detected unauthorized rendezvous with Subject 002 (Jim). Potential Alliance formation.",
                    'cairo': "Navigational Error confirmed. Divergence from 'Freedom' vector: 100%. Critical failure in pathfinding.",
                    'grangerfords': "Local conflict zone active. High probability of collateral damage. Aristocratic feudalism simulation in progress.",
                    'duke-king': "Hostile entities identified. Class: Social Engineers/Parasites. Threat level: Moderate.",
                    'wilks': "Psychological profile update: Subject 001 displaying advanced empathy traits overriding survival instincts.",
                    'phelps': "Critical Decision Point reached. Subject 001 rejecting theological constraints. Moral Singularity achieved."
                };

                this.setupListeners();
                this.startClock();
            }

            setupListeners() {
                this.els.toggle.addEventListener('click', () => this.toggle());

                // Keyboard shortcut (~)
                document.addEventListener('keydown', (e) => {
                    if (e.key === '`' || e.key === '~') {
                        e.preventDefault();
                        this.toggle();
                    }
                });

                this.els.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = this.els.input.value.trim();
                        if (cmd) {
                            this.execute(cmd);
                            this.history.push(cmd);
                            this.historyIndex = this.history.length;
                            this.els.input.value = '';
                        }
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.historyIndex > 0) {
                            this.historyIndex--;
                            this.els.input.value = this.history[this.historyIndex];
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.historyIndex < this.history.length - 1) {
                            this.historyIndex++;
                            this.els.input.value = this.history[this.historyIndex];
                        } else {
                            this.historyIndex = this.history.length;
                            this.els.input.value = '';
                        }
                    }
                });
            }

            toggle() {
                this.isOpen = !this.isOpen;
                this.els.container.classList.toggle('active', this.isOpen);
                if (this.isOpen) {
                    this.els.input.focus();
                }
            }

            log(msg, type = 'info') {
                const div = document.createElement('div');
                div.className = `log-entry log-${type}`;
                div.textContent = `> ${msg}`;
                this.els.output.appendChild(div);
                this.els.output.scrollTop = this.els.output.scrollHeight;
            }

            execute(input) {
                this.log(input, 'system');
                const parts = input.split(' ');
                const cmd = parts[0].toUpperCase();
                const args = parts.slice(1);

                switch (cmd) {
                    case 'HELP':
                        this.log('AVAILABLE COMMANDS:', 'success');
                        this.log('  STATUS     - System diagnostics', 'info');
                        this.log('  LOCATE [ID]- Pan to location', 'info');
                        this.log('  INTEL [ID] - Decrypt classified data', 'info');
                        this.log('  LIST       - List location IDs', 'info');
                        this.log('  PLAY/PAUSE - Toggle timeline', 'info');
                        this.log('  CLEAR      - Clear terminal', 'info');
                        break;

                    case 'STATUS':
                        const point = this.mc.intel.getDataAtProgress(this.mc.state.progress).currentPoint;
                        this.log(`MISSION CLOCK: ${this.mc.state.progress.toFixed(2)}%`, 'info');
                        this.log(`CURRENT SECTOR: ${point.title}`, 'info');
                        this.log(`RISK LEVEL: ${point.risk}`, point.risk === 'Critical' ? 'error' : 'warn');
                        break;

                    case 'LIST':
                        this.log('KNOWN LOCATIONS:', 'info');
                        this.mc.intel.getPoints().forEach(p => {
                            this.log(`  ${p.id} : ${p.title}`, 'system');
                        });
                        break;

                    case 'LOCATE':
                        if (args.length === 0) {
                            this.log('Usage: LOCATE [location_id]', 'error');
                            return;
                        }
                        const targetId = args[0].toLowerCase();
                        const loc = this.mc.intel.getPoints().find(p => p.id === targetId);
                        if (loc) {
                            this.mc.map.panTo(loc.lat, loc.lng);
                            this.log(`Panning to ${loc.title}...`, 'success');
                        } else {
                            this.log(`Location '${targetId}' not found.`, 'error');
                        }
                        break;

                    case 'INTEL':
                        if (args.length === 0) {
                            this.log('Usage: INTEL [location_id]', 'error');
                            return;
                        }
                        const intelId = args[0].toLowerCase();
                        if (this.secretIntel[intelId]) {
                            this.log('DECRYPTING...', 'warn');
                            setTimeout(() => {
                                this.log(this.secretIntel[intelId], 'success');
                            }, 500);
                        } else {
                            this.log('No classified intelligence found for this sector.', 'error');
                        }
                        break;

                    case 'PLAY':
                        if (!this.mc.state.isPlaying) this.mc.togglePlayback();
                        this.log('Playback initiated.', 'success');
                        break;

                    case 'PAUSE':
                        if (this.mc.state.isPlaying) this.mc.togglePlayback();
                        this.log('Playback paused.', 'warn');
                        break;

                    case 'CLEAR':
                        this.els.output.innerHTML = '';
                        break;

                    default:
                        this.log(`Unknown command: ${cmd}`, 'error');
                }
            }

            startClock() {
                setInterval(() => {
                    const now = new Date();
                    this.els.clock.textContent = now.toLocaleTimeString('en-US', {hour12: false});
                }, 1000);
            }
        }

        /**
         * Main Application Controller
         */
        class MissionControl {
            constructor() {
                this.intel = new IntelSystem(JOURNEY_DATA);
                this.map = new TacticalMap('map', 36.0, -90.5);
                this.hud = new HUDInterface();
                this.terminal = new CommandTerminal(this);

                this.state = {
                    progress: 0, // 0.0 to 1.0
                    isPlaying: false,
                    lastFrameTime: 0,
                    currentIndex: -1
                };

                this.init();
            }

            init() {
                // Render Map Elements
                this.map.renderMarkers(this.intel.getPoints(), (point) => this.handleMarkerClick(point));
                this.map.renderRoute(this.intel.getPoints());

                // Setup Listeners
                this.hud.els.playBtn.addEventListener('click', () => this.togglePlayback());

                // Timeline Interaction
                this.hud.els.sliderContainer.addEventListener('click', (e) => {
                    const rect = this.hud.els.sliderContainer.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const pct = Math.max(0, Math.min(1, x / rect.width));
                    this.seek(pct);
                });

                // Start Loop
                requestAnimationFrame((t) => this.loop(t));

                // Initial State
                this.updateMissionData(0);
            }

            handleMarkerClick(point) {
                // Pause if playing
                if (this.state.isPlaying) this.togglePlayback();

                // Jump to that point based on mileage
                const pct = point.mile / this.intel.totalDistance;
                this.seek(pct);

                this.hud.showStory(point);
            }

            togglePlayback() {
                this.state.isPlaying = !this.state.isPlaying;
                this.hud.setPlayState(this.state.isPlaying);
                if (this.state.isPlaying && this.state.progress >= 1) {
                    this.state.progress = 0; // Restart if at end
                }
            }

            seek(pct) {
                this.state.progress = pct;
                this.updateMissionData(pct);
            }

            loop(timestamp) {
                if (!this.state.lastFrameTime) this.state.lastFrameTime = timestamp;
                const deltaTime = timestamp - this.state.lastFrameTime;
                this.state.lastFrameTime = timestamp;

                if (this.state.isPlaying) {
                    // Calculate increment based on duration
                    // duration should be around 15 seconds for full scroll
                    const duration = 15000;
                    const increment = deltaTime / duration;

                    this.state.progress += increment;

                    if (this.state.progress >= 1) {
                        this.state.progress = 1;
                        this.togglePlayback();
                    }

                    this.updateMissionData(this.state.progress);
                }

                requestAnimationFrame((t) => this.loop(t));
            }

            updateMissionData(progress) {
                this.hud.updateProgress(progress);

                const { currentPoint, index } = this.intel.getDataAtProgress(progress);

                // Only update DOM if index changed or it's the first run
                if (index !== this.state.currentIndex) {
                    this.state.currentIndex = index;
                    this.hud.updateStatus(currentPoint);
                    this.map.highlightMarker(index);

                    // Auto-pan map if playing
                    if (this.state.isPlaying) {
                         this.map.panTo(currentPoint.lat, currentPoint.lng);
                    }
                }
            }
        }

        // Initialize Mission
        document.addEventListener('DOMContentLoaded', () => {
            const mission = new MissionControl();
        });

    </script>
