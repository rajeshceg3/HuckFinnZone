<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The River's Verse: Tactical Narrative Interface</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="vendor/maplibre/maplibre-gl-csp.js"></script>
    <script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
    <script src="vendor/warm-map/style.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pursuit.css">
    <link rel="stylesheet" href="css/controls.css">
</head>
<body>

    <div id="app">
        
        <!-- HUD Overlay -->
        <button id="mission-toggle" aria-expanded="false" aria-controls="mission-panel">Mission <span aria-hidden="true">+</span></button>
        <section id="mission-panel" aria-label="Mission controls" hidden inert>
        <header class="mission-header"><h2>River mission</h2><button id="mission-close" aria-label="Close mission controls">×</button></header>
        <div id="hud-overlay">
            <div class="hud-panel">
                <div class="hud-title">Mission Phase</div>
                <div class="hud-value" id="hud-phase">Awaiting Input</div>
            </div>
            <div class="hud-panel">
                <div class="hud-title">Operational Status</div>
                <div class="hud-row">
                    <span id="hud-status-text">Standby</span>
                    <div id="hud-status-light" class="status-indicator"></div>
                </div>
            </div>
            <div class="hud-panel">
                <div class="hud-title">Distance</div>
                <div class="hud-value"><span id="hud-distance">0</span> mi</div>
            </div>
        </div>

        </section>
        <!-- Map -->
        <div id="map"></div>

        <!-- Timeline Control -->
        <div id="timeline-control">
            <button id="play-pause-btn" aria-label="Play Mission">
                <svg aria-hidden="true" width="14" height="18" viewBox="0 0 14 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L13 9L1 17V1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>
            <input type="range" id="timeline-slider" min="0" max="100" value="0" step="0.1" aria-label="Mission Timeline">
        </div>

        <!-- Story Panel -->
        <section id="story-panel" role="dialog" aria-label="River story" hidden inert>
            <header class="story-header"><h3 id="panel-title"></h3><button id="close-panel" aria-label="Close story"></button></header>
            <div id="panel-body"></div>
        </section>

        <!-- Decor -->
        <div id="river-svg" aria-hidden="true">
            <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                <defs>
                    <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                </defs>
                <g class="parallax">
                    <use href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
                    <use href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                    <use href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                    <use href="#gentle-wave" x="48" y="7" fill="#fff" />
                </g>
            </svg>
        </div>

        <!-- Command Terminal -->
        <button id="terminal-toggle" aria-expanded="false" aria-controls="terminal-container">Open command terminal</button>
        <div id="terminal-container" role="dialog" aria-label="Command terminal" hidden inert>
            <div id="terminal-header">
                <span>HF-OS v2.4.1</span><button id="terminal-close" aria-label="Close command terminal">×</button>
                <span id="terminal-clock">00:00:00</span>
            </div>
            <div id="terminal-output">
                <div class="log-entry log-system">Initializing tactical interface...</div>
                <div class="log-entry log-system">Connection established.</div>
                <div class="log-entry log-info">Welcome, Operative. Type 'HELP' for command list.</div>
            </div>
            <div id="terminal-input-line">
                <span id="terminal-prompt">root@river:~$</span>
                <input type="text" id="terminal-input" aria-label="Command" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <!-- Main Logic -->
    <script type="module" src="js/mission.js"></script>
</body>
</html>
